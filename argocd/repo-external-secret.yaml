apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cis-repo
  namespace: argocd
  labels:
    app.kubernetes.io/name: cis-argocd-repo-secret
    app.kubernetes.io/part-of: cis
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-cluster-store
    kind: ClusterSecretStore
  target:
    name: cis-repo-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: "git"
        url: git@github.com:Dragnet-Solutions/cis.git
        sshPrivateKey: "{{ .sshPrivateKey }}"
  data:
    - secretKey: sshPrivateKey
      remoteRef:
        key: cis-argocd-deploy-key
