# The landing page's nginx config inside the container image.
# TLS and the http → https redirect are the ingress's job; this listens on
# plain :8080 as the unprivileged nginx user. (server-config/ holds the
# equivalent config for a plain VM install with its own certificate.)

map $sent_http_content_type $cisds_expires {
    default        10m;
    ~^text/css     30d;
    ~^font/woff2   30d;
    ~^image/       30d;
}

# www → apex, same as the VM config.
server {
    listen 8080;
    server_name www.cisdragnetstudy.com;
    server_tokens off;
    return 301 https://cisdragnetstudy.com$request_uri;
}

server {
    # default_server: probes and in-cluster requests arrive with a pod IP or
    # Service name as Host, not the public name.
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    # Behind the TLS-terminating ingress: any redirect nginx makes itself
    # (e.g. a directory's trailing slash) must be relative, never http://host:8080/.
    absolute_redirect off;

    root /var/www/cisdragnetstudy;
    index index.html;
    charset utf-8;

    # ---- PLATFORM LINKS: switched off for the marketing launch. ----
    # When the Product Owner says the platform is live, remove the "#" from
    # the two lines below and put in the real addresses.
    # location = /survey { return 302 https://PLATFORM-SURVEY-ADDRESS; }
    # location = /firm   { return 302 https://PLATFORM-FIRM-ADDRESS; }

    # Security headers (inherited by every location below that sets none)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Caching: pages 10 minutes, images/fonts/styles 30 days
    expires $cisds_expires;

    # Text files are pre-compressed at build time; gzip covers anything else.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_types text/css text/plain application/xml application/manifest+json image/svg+xml image/x-icon;

    error_page 404 /404.html;

    # Liveness for the container HEALTHCHECK / k8s probes.
    location = /healthz {
        access_log off;
        expires off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Older mime.types lack .webmanifest; default_type only applies then.
    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Never serve hidden files
    location ~ /\. {
        deny all;
    }
}
