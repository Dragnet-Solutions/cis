# CIS - Dragnet Study landing page: nginx site config
# Only TWO lines need editing (marked CHANGE ME). Everything else can stay as it is.

map $sent_http_content_type $cisds_expires {
    default      10m;
    text/css     30d;
    font/woff2   30d;
    ~image/      30d;
}

server {
    listen 80;
    listen [::]:80;
    server_name cisdragnetstudy.com www.cisdragnetstudy.com;
    return 301 https://cisdragnetstudy.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.cisdragnetstudy.com;
    ssl_certificate     /etc/letsencrypt/live/cisdragnetstudy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cisdragnetstudy.com/privkey.pem;
    return 301 https://cisdragnetstudy.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cisdragnetstudy.com;

    ssl_certificate     /etc/letsencrypt/live/cisdragnetstudy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cisdragnetstudy.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/cisdragnetstudy;
    index index.html;
    charset utf-8;
    server_tokens off;

    # ---- Buttons on the page go to /survey and /firm. Point them at the platform here. ----
    location = /survey { return 302 https://PLATFORM-SURVEY-ADDRESS; }   # CHANGE ME
    location = /firm   { return 302 https://PLATFORM-FIRM-ADDRESS; }     # CHANGE ME

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Caching: pages 10 minutes, images/fonts/styles 30 days
    expires $cisds_expires;

    gzip on;
    gzip_types text/css text/plain application/xml application/manifest+json image/svg+xml;

    error_page 404 /404.html;
    location / { try_files $uri $uri/ =404; }

    # Never serve hidden files
    location ~ /\. { deny all; }
}
