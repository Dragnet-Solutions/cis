apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cis-api-secrets
  namespace: dev
  labels:
    app.kubernetes.io/name: cis-api
    app.kubernetes.io/part-of: cis
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: SecretStore
  target:
    name: cis-api-secrets
    creationPolicy: Owner
  data:
    # Full connection string, e.g.
    # postgres://<user>:<password>@<server>.postgres.database.azure.com:5432/cis?sslmode=require
    - secretKey: DATABASE_URL
      remoteRef:
        key: cis-dev-DATABASE-URL

    # At least 32 characters. Generate with:
    # node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
    - secretKey: JWT_SECRET
      remoteRef:
        key: cis-dev-JWT-SECRET

    # Shared by the cis-redis StatefulSet (--requirepass) and the API
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: cis-dev-REDIS-PASSWORD

    # Azure AI Foundry key for the report narrative
    - secretKey: AZURE_AI_API_KEY
      remoteRef:
        key: cis-dev-AZURE-AI-API-KEY

    # Outbound mail, e.g. smtps://<user>:<password>@smtp.zeptomail.com:465
    - secretKey: SMTP_URL
      remoteRef:
        key: cis-dev-SMTP-URL

    # ZeptoMail API token used by the invitations service
    - secretKey: ZEPTOMAIL_API_TOKEN
      remoteRef:
        key: cis-dev-ZEPTOMAIL-API-TOKEN
