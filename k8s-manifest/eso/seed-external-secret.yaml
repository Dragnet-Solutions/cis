# DEV ONLY — the seeded operators' passwords, read only by the cis-db-seed Job
# (kept out of cis-api-secrets so the running API never holds them).
# Each must be 12+ characters and not the seed default.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cis-seed-secrets
  namespace: dev
  labels:
    app.kubernetes.io/name: cis-db-seed
    app.kubernetes.io/part-of: cis
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-store
    kind: SecretStore
  target:
    name: cis-seed-secrets
    creationPolicy: Owner
  data:
    # adaeze.okoro@cis.example
    - secretKey: SEED_PASSWORD_MAKER
      remoteRef:
        key: cis-dev-SEED-PASSWORD-MAKER
    # segun.oyegbesan@dragnet.example
    - secretKey: SEED_PASSWORD_CHECKER
      remoteRef:
        key: cis-dev-SEED-PASSWORD-CHECKER
