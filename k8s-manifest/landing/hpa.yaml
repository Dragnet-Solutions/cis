apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cis-landing-hpa
  namespace: dev
  labels:
    app.kubernetes.io/name: cis-landing
    app.kubernetes.io/part-of: cis
    app.kubernetes.io/component: landing
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cis-landing
  minReplicas: 1
  maxReplicas: 3
  # CPU only: static nginx memory is flat, and against a 32Mi request a memory
  # target would only make the HPA flap.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
