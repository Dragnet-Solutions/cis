apiVersion: v1
kind: ConfigMap
metadata:
  name: cis-api-config
  namespace: dev
  labels:
    app.kubernetes.io/name: cis-api
    app.kubernetes.io/part-of: cis
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  # ── Application ──────────────────────────────────────────────────────────
  NODE_ENV: "production"
  HOST: "0.0.0.0"
  PORT: "3000"
  LOG_LEVEL: "info"
  TRUST_PROXY: "2"

  # ── Database ─────────────────────────────────────────────────────────────
  DB_HOST: "refme.postgres.database.azure.com"
  DB_PORT: "5432"

  # ── Redis (dedicated in-cluster StatefulSet) ─────────────────────────────
  # REDIS_PASSWORD comes from the ExternalSecret (cis-api-secrets).
  REDIS_HOST: "cis-redis"
  REDIS_PORT: "6379"

  # ── Auth rate limiting ───────────────────────────────────────────────────
  # Held in memory per pod — the effective limit scales with the replica count.
  RATE_LIMIT_AUTH_MAX: "10"
  RATE_LIMIT_AUTH_WINDOW_MS: "900000"
  # "Forgot password?" requests per address per window (also capped per account).
  RATE_LIMIT_RESET_MAX: "5"
  # Dev only: respondent robot's public IP. Remove after the run.
  RATE_LIMIT_ALLOWLIST: "105.113.78.141"

  # ── Report PDFs & links ──────────────────────────────────────────────────
  # REPORT_RENDER_URL: where the API's headless Chromium opens the print pages.
  # In-cluster cis-admin Service (never leaves the cluster); its nginx proxies the
  # page's /api calls back to cis-api.
  REPORT_RENDER_URL: "http://cis-admin"
  # PORTAL_URL: public origin used in links sent to firms by email.
  PORTAL_URL: "https://dev-cis.idhub.ng"

  # ── Mail ─────────────────────────────────────────────────────────────────
  # Notices are sent through ZeptoMail's HTTP API; ZEPTOMAIL_API_TOKEN comes from
  # the ExternalSecret. Without it, SMTP_URL (also from the ExternalSecret) is the
  # fallback; with neither, outbox mail is only recorded (logged), not sent.
  # Use the regional host the ZeptoMail account lives on (api.zeptomail.eu, .in, …).
  ZEPTOMAIL_API_URL: "https://api.zeptomail.com/v1.1/email"
  # The sender's domain must be verified in the ZeptoMail Mail Agent. The display
  # name is the study's name; the address stays on idhub.ng until DevOps/IT move
  # sending to cisdragnetstudy.com (see README) — only this value changes then.
  MAIL_FROM: "The CIS-Dragnet Benchmark Study <noreply@idhub.ng>"
  # Replies to every email go to the support address (unset, it defaults to
  # SUPPORT_EMAIL; set explicitly so the two are read together).
  MAIL_REPLY_TO: "support@cisdragnetstudy.com"
  # Shown in every email's footer ("Questions? Contact …") and in the reports.
  SUPPORT_EMAIL: "support@cisdragnetstudy.com"

  # ── Background jobs (in-process timers; no CronJob) ──────────────────────
  # Defaults shown; uncomment to change. Several pods are safe (see README).
  # MAIL_DISPATCH: "off"                    # stop sending the email outbox
  # MAIL_DISPATCH_INTERVAL_MS: "15000"
  # REMINDER_SCHEDULE: "off"                # stop sending respondent reminders automatically
  # REMINDER_SCHEDULE_INTERVAL_MS: "3600000"  # one hour
  # REMINDER_SCHEDULE_FIRST_RUN_MS: "60000"   # first pass a minute after a pod starts

  # ── AI report narrative (Azure AI Foundry) ───────────────────────────────
  # AZURE_AI_API_KEY comes from the ExternalSecret.
  AZURE_AI_ENDPOINT: "https://dragnet-gateway-resource.services.ai.azure.com/api/projects/dragnet-gateway"
  AZURE_AI_MODEL: "DeepSeek-V4-Pro"
