apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cis-redis
  namespace: dev
  labels:
    app.kubernetes.io/name: cis-redis
    app.kubernetes.io/part-of: cis
    app.kubernetes.io/component: cache
  annotations:
    # Wave 1: up before the api Deployment (wave 3), whose init container waits for it.
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceName: cis-redis-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cis-redis
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cis-redis
        app.kubernetes.io/part-of: cis
        app.kubernetes.io/component: cache
    spec:
      serviceAccountName: cis-redis-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8.8.0
          imagePullPolicy: IfNotPresent
          # Password is injected at runtime from the shared api secret so the
          # same REDIS_PASSWORD value is used by both Redis and the API.
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --save
            - "900 1"
            - --save
            - "300 10"
            - --save
            - "60 10000"
            - --maxmemory
            - "256mb"
            - --maxmemory-policy
            - allkeys-lru
            - --loglevel
            - notice
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cis-api-secrets
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 384Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: redis-data
        labels:
          app.kubernetes.io/name: cis-redis
          app.kubernetes.io/part-of: cis
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: managed-csi
        resources:
          requests:
            storage: 2Gi
