apiVersion: batch/v1
kind: Job
metadata:
  name: cis-db-migration
  namespace: dev
  labels:
    app.kubernetes.io/name: cis-db-migration
    app.kubernetes.io/part-of: cis
    app.kubernetes.io/component: migration
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cis-db-migration
        app.kubernetes.io/part-of: cis
        app.kubernetes.io/component: migration
    spec:
      serviceAccountName: cis-api-sa
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w5 ${DB_HOST} ${DB_PORT}; do
                echo "Waiting for Postgres at ${DB_HOST}:${DB_PORT}..."; sleep 5
              done
          envFrom:
            - configMapRef:
                name: cis-api-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        # Image CMD: node-pg-migrate up --migrations-dir migrations --database-url-var DATABASE_URL
        - name: migrate
          image: dragnet.azurecr.io/cis-api-migrate:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: cis-api-config
            - secretRef:
                name: cis-api-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
